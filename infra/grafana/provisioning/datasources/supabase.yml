apiVersion: 1

datasources:
  - name: Supabase PostgreSQL
    uid: supabase-pg          # matches uid in truespend_main.json
    type: postgres
    access: proxy
    url: ${SUPABASE_DB_HOST}:${SUPABASE_DB_PORT}
    database: ${SUPABASE_DB_NAME}
    user: ${SUPABASE_DB_USER}
    secureJsonData:
      password: ${SUPABASE_DB_PASSWORD}
    jsonData:
      sslmode: require        # Supabase requires SSL
      postgresVersion: 1500   # PostgreSQL 15
      timescaledb: false
    isDefault: true
    editable: false           # lock it so nobody changes it via UI
