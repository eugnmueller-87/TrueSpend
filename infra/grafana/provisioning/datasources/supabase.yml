apiVersion: 1

datasources:
  - name: TrueSpend PostgreSQL
    uid: supabase-pg          # uid kept for dashboard compatibility
    type: postgres
    access: proxy
    url: ${DATABASE_HOST}:${DATABASE_PORT}
    database: ${DATABASE_NAME}
    user: ${DATABASE_USER}
    secureJsonData:
      <REDACTED_ROTATE_ME>: ${DATABASE_PASSWORD}
    jsonData:
      sslmode: require
      postgresVersion: 1500
      timescaledb: false
    isDefault: true
    editable: false
