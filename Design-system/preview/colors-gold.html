<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brand gold</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
</head>
<body>

<div class="pv-eyebrow">Brand gold — the single accent</div>
<div style="display:flex;gap:12px;align-items:stretch;">
  <div style="flex:1.4;background:var(--ts-ink-night);border-radius:8px;padding:22px;display:flex;flex-direction:column;justify-content:space-between;min-height:140px;">
    <svg width="40" height="40" viewBox="0 0 64 64" fill="none">
      <path d="M16 18 H48 V25 H37 V48 H29 V25 H16 Z" fill="#B07219"/>
      <path d="M22 18 L42 18 L42 25 L33 25 L33 32 L25 32 L25 25 L22 25 Z" fill="#D89E40" opacity="0.85"/>
    </svg>
    <div>
      <div style="color:var(--ts-paper);font-size:13px;font-weight:500;">Gold on ink</div>
      <div class="ts-mono" style="color:var(--ts-brand-gold-soft);font-size:11px;">The mark · primary CTA · agent signal</div>
    </div>
  </div>
  
  <div style="flex:1;min-width:0;">
    <div style="height:84px;background:#B07219;border-radius:6px;border:1px solid var(--ts-line);"></div>
    <div style="font-size:12px;color:var(--ts-ink);margin-top:8px;font-weight:500;">Gold</div>
    <div class="ts-mono" style="color:var(--ts-ink-mute);font-size:11px;margin-top:2px;">#B07219</div>
    <div class="ts-mono" style="color:var(--ts-ink-faint);font-size:10px;margin-top:1px;">--ts-brand-gold</div>
  </div>
  
  <div style="flex:1;min-width:0;">
    <div style="height:84px;background:#8F5C12;border-radius:6px;border:1px solid var(--ts-line);"></div>
    <div style="font-size:12px;color:var(--ts-ink);margin-top:8px;font-weight:500;">Gold deep</div>
    <div class="ts-mono" style="color:var(--ts-ink-mute);font-size:11px;margin-top:2px;">#8F5C12</div>
    <div class="ts-mono" style="color:var(--ts-ink-faint);font-size:10px;margin-top:1px;">--ts-brand-gold-deep</div>
  </div>
  
  <div style="flex:1;min-width:0;">
    <div style="height:84px;background:#E9DAB5;border-radius:6px;border:1px solid var(--ts-line);"></div>
    <div style="font-size:12px;color:var(--ts-ink);margin-top:8px;font-weight:500;">Gold soft</div>
    <div class="ts-mono" style="color:var(--ts-ink-mute);font-size:11px;margin-top:2px;">#E9DAB5</div>
    <div class="ts-mono" style="color:var(--ts-ink-faint);font-size:10px;margin-top:1px;">--ts-brand-gold-soft</div>
  </div>
  
  <div style="flex:1;min-width:0;">
    <div style="height:84px;background:#F7EFDE;border-radius:6px;border:1px solid var(--ts-line);"></div>
    <div style="font-size:12px;color:var(--ts-ink);margin-top:8px;font-weight:500;">Gold wash</div>
    <div class="ts-mono" style="color:var(--ts-ink-mute);font-size:11px;margin-top:2px;">#F7EFDE</div>
    <div class="ts-mono" style="color:var(--ts-ink-faint);font-size:10px;margin-top:1px;">--ts-brand-gold-wash</div>
  </div>
</div>
</body></html>
