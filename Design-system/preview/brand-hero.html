<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hero treatment</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
</head>
<body>

<style>
  body { padding: 0; }
  .hero { position:relative; width:100%; height:240px; overflow:hidden; border-radius:0; background:#0E0B09; }
  .hero img { width:100%; height:100%; object-fit:cover; opacity:0.78; filter:contrast(1.05) saturate(0.9); }
  .hero .overlay { position:absolute; inset:0; background:linear-gradient(90deg, rgba(14,11,9,0.78) 0%, rgba(14,11,9,0.4) 50%, rgba(14,11,9,0.1) 100%); }
  .hero .copy { position:absolute; left:32px; top:50%; transform:translateY(-50%); max-width:420px; }
  .hero .eyebrow { font-family:var(--ts-font-sans); font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:var(--ts-brand-gold); margin-bottom:14px; }
  .hero h1 { font-family:var(--ts-font-display); font-size:36px; line-height:1.04; letter-spacing:-0.025em; color:#F7F4ED; margin:0; text-wrap:balance; }
  .hero h1 em { font-style:normal; color:var(--ts-brand-gold); }
</style>
<div class="hero">
  <img src="../assets/hero-billboard.png" alt="">
  <div class="overlay"></div>
  <div class="copy">
    <div class="eyebrow">TrueSpend · brand hero</div>
    <h1>I don't fix procurement.<br><em>I make it irrelevant.</em></h1>
  </div>
</div>
</body></html>
