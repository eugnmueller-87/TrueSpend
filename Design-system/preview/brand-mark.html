<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mark</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
</head>
<body>

<div style="display:flex;align-items:center;gap:36px;padding:8px 0;">
  <div style="width:120px;height:120px;border-radius:14px;background:var(--ts-ink-night);display:flex;align-items:center;justify-content:center;">
    <!-- Big version of the T mark -->
    <svg width="76" height="76" viewBox="0 0 64 64" fill="none">
      <path d="M16 18 H48 V25 H37 V48 H29 V25 H16 Z" fill="#B07219"/>
      <path d="M22 18 L42 18 L42 25 L33 25 L33 32 L25 32 L25 25 L22 25 Z" fill="#D89E40" opacity="0.85"/>
    </svg>
  </div>
  <div>
    <div class="pv-eyebrow" style="margin:0 0 8px;">Monogram</div>
    <div style="font-family:var(--ts-font-display);font-size:32px;line-height:1.05;color:var(--ts-ink);letter-spacing:-0.02em;margin-bottom:6px;">The T mark</div>
    <div style="font-size:13px;color:var(--ts-ink-soft);line-height:1.55;max-width:340px;">Two overlapping bars carved from the brand gold. The agent's signature — never recolored, never resized below 24&nbsp;px.</div>
    <div style="display:flex;gap:8px;margin-top:14px;">
      <span class="ts-mono" style="color:var(--ts-ink-mute);">#B07219</span>
      <span class="ts-mono" style="color:var(--ts-ink-mute);">/ #D89E40</span>
    </div>
  </div>
</div>
</body></html>
