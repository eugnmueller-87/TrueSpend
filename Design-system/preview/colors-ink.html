<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ink scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
</head>
<body>

<div class="pv-eyebrow">Ink — text colors</div>
<div style="display:flex;flex-direction:column;gap:0;">
  <div class="pv-row"><div style="width:24px;height:24px;border-radius:4px;background:#161413;"></div><div style="flex:1;"><span style="font-size:14px;color:#161413;font-weight:500;">Primary text — the ledger entry</span><div class="ts-mono" style="color:var(--ts-ink-mute);font-size:11px;">--ts-ink · #161413</div></div></div>
  <div class="pv-row"><div style="width:24px;height:24px;border-radius:4px;background:#3D3633;"></div><div style="flex:1;"><span style="font-size:14px;color:#3D3633;">Soft text — supporting body copy</span><div class="ts-mono" style="color:var(--ts-ink-mute);font-size:11px;">--ts-ink-soft · #3D3633</div></div></div>
  <div class="pv-row"><div style="width:24px;height:24px;border-radius:4px;background:#75695F;"></div><div style="flex:1;"><span style="font-size:14px;color:#75695F;">Mute — labels, captions, timestamps</span><div class="ts-mono" style="color:var(--ts-ink-mute);font-size:11px;">--ts-ink-mute · #75695F</div></div></div>
  <div class="pv-row"><div style="width:24px;height:24px;border-radius:4px;background:#A89B8B;"></div><div style="flex:1;"><span style="font-size:14px;color:#A89B8B;">Faint — placeholder, disabled</span><div class="ts-mono" style="color:var(--ts-ink-mute);font-size:11px;">--ts-ink-faint · #A89B8B</div></div></div>
</div>
</body></html>
