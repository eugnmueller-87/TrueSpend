<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shadow scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
</head>
<body>

<div class="pv-eyebrow">Elevation — used rarely</div>
<div style="display:flex;gap:24px;padding:14px 0 24px;">
  <div style="text-align:center;flex:1;">
    <div style="height:84px;background:var(--ts-surface);border:1px solid var(--ts-line);border-radius:6px;box-shadow:var(--ts-shadow-xs);"></div>
    <div style="font-size:12px;color:var(--ts-ink);margin-top:10px;font-weight:500;">xs</div>
    <div class="ts-mono" style="color:var(--ts-ink-mute);font-size:10px;">resting · default</div>
  </div>
  <div style="text-align:center;flex:1;">
    <div style="height:84px;background:var(--ts-surface);border-radius:6px;box-shadow:var(--ts-shadow-sm);"></div>
    <div style="font-size:12px;color:var(--ts-ink);margin-top:10px;font-weight:500;">sm</div>
    <div class="ts-mono" style="color:var(--ts-ink-mute);font-size:10px;">subtle card</div>
  </div>
  <div style="text-align:center;flex:1;">
    <div style="height:84px;background:var(--ts-surface);border-radius:6px;box-shadow:var(--ts-shadow-md);"></div>
    <div style="font-size:12px;color:var(--ts-ink);margin-top:10px;font-weight:500;">md</div>
    <div class="ts-mono" style="color:var(--ts-ink-mute);font-size:10px;">hover lift</div>
  </div>
  <div style="text-align:center;flex:1;">
    <div style="height:84px;background:var(--ts-surface);border-radius:10px;box-shadow:var(--ts-shadow-lg);"></div>
    <div style="font-size:12px;color:var(--ts-ink);margin-top:10px;font-weight:500;">lg</div>
    <div class="ts-mono" style="color:var(--ts-ink-mute);font-size:10px;">modal · popover</div>
  </div>
</div>
</body></html>
