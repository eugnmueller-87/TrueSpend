<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mono — refs, IDs, money</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
</head>
<body>

<div class="pv-eyebrow">Geist Mono · references &amp; money</div>
<div style="display:flex;flex-direction:column;gap:18px;">
  <div>
    <div class="ts-caption" style="margin-bottom:6px;">Reference IDs</div>
    <div style="display:flex;gap:18px;align-items:baseline;">
      <span class="ts-mono" style="font-size:14px;color:var(--ts-ink);">TS-2026-0481</span>
      <span class="ts-mono" style="font-size:13px;color:var(--ts-ink-soft);">PO/DACH/00219</span>
      <span class="ts-mono" style="font-size:12px;color:var(--ts-ink-mute);">SKU APPMBP14M3PRO</span>
    </div>
  </div>
  <div>
    <div class="ts-caption" style="margin-bottom:6px;">Tabular money column</div>
    <div style="font-family:var(--ts-font-sans);font-variant-numeric:tabular-nums lining-nums;letter-spacing:-0.005em;display:grid;grid-template-columns:1fr auto;row-gap:4px;column-gap:32px;max-width:340px;font-size:15px;color:var(--ts-ink);">
      <span style="color:var(--ts-ink-soft);font-size:13px;">MacBook Pro 14"</span><span>€2.199</span>
      <span style="color:var(--ts-ink-soft);font-size:13px;">Dell UltraSharp 27"</span><span>€549</span>
      <span style="color:var(--ts-ink-soft);font-size:13px;">SOC 2 Type II audit</span><span>€35.000</span>
      <span style="color:var(--ts-ink-soft);font-size:13px;border-top:1px solid var(--ts-line);padding-top:4px;">Quarter spent</span><span style="border-top:1px solid var(--ts-line);padding-top:4px;font-weight:600;">€576.000</span>
    </div>
  </div>
</div>
</body></html>
