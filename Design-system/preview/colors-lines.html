<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hairlines</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
</head>
<body>

<div class="pv-eyebrow">Hairlines — hierarchy without shadow</div>
<div style="display:flex;flex-direction:column;gap:22px;padding:6px 0;">
  <div>
    <div style="height:1px;background:#EEE7DA;"></div>
    <div style="font-size:12px;color:var(--ts-ink-soft);margin-top:6px;">Whisper · 1px · <span class="ts-mono" style="color:var(--ts-ink-mute);">--ts-line-soft</span></div>
  </div>
  <div>
    <div style="height:1px;background:#E5DDD0;"></div>
    <div style="font-size:12px;color:var(--ts-ink-soft);margin-top:6px;">Default · 1px · <span class="ts-mono" style="color:var(--ts-ink-mute);">--ts-line</span></div>
  </div>
  <div>
    <div style="height:1px;background:#C9BFAE;"></div>
    <div style="font-size:12px;color:var(--ts-ink-soft);margin-top:6px;">Strong · 1px · <span class="ts-mono" style="color:var(--ts-ink-mute);">--ts-line-strong</span> — under H1, around focused cards</div>
  </div>
  <div>
    <div style="height:1px;background:var(--ts-ink-night);"></div>
    <div style="font-size:12px;color:var(--ts-ink-soft);margin-top:6px;">Ink rule · 1px · <span class="ts-mono" style="color:var(--ts-ink-mute);">--ts-ink-night</span> — page-level emphasis only</div>
  </div>
</div>
</body></html>
