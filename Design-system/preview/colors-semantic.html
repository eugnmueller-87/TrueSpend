<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Semantic palette</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
</head>
<body>

<div class="pv-eyebrow">Status — muted, finance-grade</div>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;">
  <div>
    <div style="display:flex;gap:4px;height:48px;">
      <div style="flex:1;background:#3D7A5A;border-radius:5px 0 0 5px;"></div>
      <div style="flex:1;background:#DCE8DF;"></div>
      <div style="flex:1;background:#EEF3EE;border-radius:0 5px 5px 0;"></div>
    </div>
    <div style="font-size:12px;font-weight:500;color:var(--ts-ink);margin-top:8px;">Sage · positive</div>
    <div class="ts-mono" style="color:var(--ts-ink-mute);font-size:10px;">approved · on-track</div>
  </div>
  <div>
    <div style="display:flex;gap:4px;height:48px;">
      <div style="flex:1;background:#C99119;border-radius:5px 0 0 5px;"></div>
      <div style="flex:1;background:#F3E4BE;"></div>
      <div style="flex:1;background:#FAF1D7;border-radius:0 5px 5px 0;"></div>
    </div>
    <div style="font-size:12px;font-weight:500;color:var(--ts-ink);margin-top:8px;">Amber · warning</div>
    <div class="ts-mono" style="color:var(--ts-ink-mute);font-size:10px;">needs attention</div>
  </div>
  <div>
    <div style="display:flex;gap:4px;height:48px;">
      <div style="flex:1;background:#B5462E;border-radius:5px 0 0 5px;"></div>
      <div style="flex:1;background:#ECCFC7;"></div>
      <div style="flex:1;background:#F6E5DE;border-radius:0 5px 5px 0;"></div>
    </div>
    <div style="font-size:12px;font-weight:500;color:var(--ts-ink);margin-top:8px;">Brick · negative</div>
    <div class="ts-mono" style="color:var(--ts-ink-mute);font-size:10px;">blocked · rejected</div>
  </div>
  <div>
    <div style="display:flex;gap:4px;height:48px;">
      <div style="flex:1;background:#2B5F7A;border-radius:5px 0 0 5px;"></div>
      <div style="flex:1;background:#D2DFE6;"></div>
      <div style="flex:1;background:#E6EEF2;border-radius:0 5px 5px 0;"></div>
    </div>
    <div style="font-size:12px;font-weight:500;color:var(--ts-ink);margin-top:8px;">Slate · info</div>
    <div class="ts-mono" style="color:var(--ts-ink-mute);font-size:10px;">escalation route</div>
  </div>
</div>
</body></html>
