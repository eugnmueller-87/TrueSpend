<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bottom nav</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
<style>
  /* Component styles re-declared inline so each card is self-contained */
  .btn { font-family:var(--ts-font-sans); font-weight:500; font-size:14px; padding:10px 18px; border-radius:4px; border:1px solid transparent; cursor:pointer; transition:background var(--ts-dur-fast) var(--ts-ease), border-color var(--ts-dur-fast); line-height:1; letter-spacing:-0.005em; }
  .btn-primary { background:var(--ts-brand-gold); color:#FFFEFB; }
  .btn-primary:hover { background:var(--ts-brand-gold-deep); }
  .btn-secondary { background:transparent; color:var(--ts-ink); border-color:var(--ts-line-strong); }
  .btn-secondary:hover { background:var(--ts-paper-deep); }
  .btn-tertiary { background:transparent; color:var(--ts-ink-soft); border-color:transparent; padding-left:10px; padding-right:10px; }
  .btn-tertiary:hover { color:var(--ts-ink); }
  .btn-danger { background:transparent; color:var(--ts-negative); border-color:var(--ts-negative-soft); }
  .btn-danger:hover { background:var(--ts-negative-wash); }
  .btn-sm { padding:7px 12px; font-size:12.5px; }
  .btn-ink { background:var(--ts-ink-night); color:var(--ts-paper); }
  .btn-ink:hover { background:#000; }

  .pill { display:inline-flex; align-items:center; gap:6px; font-family:var(--ts-font-sans); font-size:11px; font-weight:500; padding:4px 9px; border-radius:2px; letter-spacing:0.04em; text-transform:uppercase; }
  .pill .dot { width:6px; height:6px; border-radius:50%; }

  .input { font-family:var(--ts-font-sans); font-size:14px; padding:10px 12px; border-radius:4px; border:1px solid var(--ts-line); background:var(--ts-surface); color:var(--ts-ink); width:100%; outline:none; box-sizing:border-box; transition:border-color var(--ts-dur-fast) var(--ts-ease); }
  .input::placeholder { color:var(--ts-ink-faint); }
  .input:focus { border-color:var(--ts-brand-gold); box-shadow:0 0 0 2px var(--ts-brand-gold-wash); }
</style>
</head>
<body>

<div class="pv-eyebrow">Bottom navigation (mobile)</div>
<div style="background:var(--ts-paper);border:1px solid var(--ts-line);border-radius:8px;overflow:hidden;max-width:460px;">
  <div style="height:1px;background:var(--ts-line);"></div>
  <div style="display:flex;background:var(--ts-surface);">
    
      <button style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:11px 4px 10px;background:none;border:none;cursor:pointer;color:var(--ts-brand-gold-deep);position:relative;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12l9-9 9 9"/><path d="M5 10v11h5v-7h4v7h5V10"/>
          
          
          
        </svg>
        <span style="font-size:10px;font-weight:500;letter-spacing:0.02em;">Home</span>
        
        <span style="position:absolute;top:0;left:50%;transform:translateX(-50%);width:24px;height:2px;background:var(--ts-brand-gold);"></span>
      </button>
    
      <button style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:11px 4px 10px;background:none;border:none;cursor:pointer;color:var(--ts-ink-mute);position:relative;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          
          <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
          
          
        </svg>
        <span style="font-size:10px;font-weight:500;letter-spacing:0.02em;">Catalog</span>
        
        
      </button>
    
      <button style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:11px 4px 10px;background:none;border:none;cursor:pointer;color:var(--ts-ink-mute);position:relative;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          
          
          <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>
          
        </svg>
        <span style="font-size:10px;font-weight:500;letter-spacing:0.02em;">My orders</span>
        
        
      </button>
    
      <button style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:11px 4px 10px;background:none;border:none;cursor:pointer;color:var(--ts-ink-mute);position:relative;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          
          
          
          <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><circle cx="7" cy="14" r="1" fill="currentColor"/><path d="M11 14h7"/>
        </svg>
        <span style="font-size:10px;font-weight:500;letter-spacing:0.02em;">Board</span>
        <span style="position:absolute;top:7px;right:30%;background:var(--ts-negative);color:#FFFEFB;font-size:9px;font-weight:600;border-radius:99px;padding:1px 5px;line-height:1.2;">3</span>
        
      </button>
    
  </div>
</div>
</body></html>
