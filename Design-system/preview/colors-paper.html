<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Paper surfaces</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
</head>
<body>

<div class="pv-eyebrow">Surfaces — paper, not screen</div>
<div style="display:flex;gap:12px;">
  
  <div style="flex:1;min-width:0;">
    <div style="height:84px;background:#F7F4ED;border-radius:6px;border:1px solid var(--ts-line);"></div>
    <div style="font-size:12px;color:var(--ts-ink);margin-top:8px;font-weight:500;">Paper</div>
    <div class="ts-mono" style="color:var(--ts-ink-mute);font-size:11px;margin-top:2px;">#F7F4ED</div>
    <div class="ts-mono" style="color:var(--ts-ink-faint);font-size:10px;margin-top:1px;">--ts-paper</div>
  </div>
  
  <div style="flex:1;min-width:0;">
    <div style="height:84px;background:#EFEBE1;border-radius:6px;border:1px solid var(--ts-line);"></div>
    <div style="font-size:12px;color:var(--ts-ink);margin-top:8px;font-weight:500;">Paper deep</div>
    <div class="ts-mono" style="color:var(--ts-ink-mute);font-size:11px;margin-top:2px;">#EFEBE1</div>
    <div class="ts-mono" style="color:var(--ts-ink-faint);font-size:10px;margin-top:1px;">--ts-paper-deep</div>
  </div>
  
  <div style="flex:1;min-width:0;">
    <div style="height:84px;background:#FFFEFB;border-radius:6px;border:1px solid var(--ts-line);"></div>
    <div style="font-size:12px;color:var(--ts-ink);margin-top:8px;font-weight:500;">Surface</div>
    <div class="ts-mono" style="color:var(--ts-ink-mute);font-size:11px;margin-top:2px;">#FFFEFB</div>
    <div class="ts-mono" style="color:var(--ts-ink-faint);font-size:10px;margin-top:1px;">--ts-surface</div>
  </div>
  
  <div style="flex:1;min-width:0;">
    <div style="height:84px;background:#FFFFFF;border-radius:6px;border:1px solid var(--ts-line);"></div>
    <div style="font-size:12px;color:var(--ts-ink);margin-top:8px;font-weight:500;">Raised</div>
    <div class="ts-mono" style="color:var(--ts-ink-mute);font-size:11px;margin-top:2px;">#FFFFFF</div>
    <div class="ts-mono" style="color:var(--ts-ink-faint);font-size:10px;margin-top:1px;">--ts-surface-raised</div>
  </div>
  
  <div style="flex:1;min-width:0;">
    <div style="height:84px;background:#161413;border-radius:6px;border:1px solid transparent;"></div>
    <div style="font-size:12px;color:var(--ts-ink);margin-top:8px;font-weight:500;">Ink night</div>
    <div class="ts-mono" style="color:var(--ts-ink-mute);font-size:11px;margin-top:2px;">#161413</div>
    <div class="ts-mono" style="color:var(--ts-ink-faint);font-size:10px;margin-top:1px;">--ts-ink-night</div>
  </div>
</div>
</body></html>
