<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tagline</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
<style>
  .voice-h {
    font-family: 'Newsreader', 'Times New Roman', Georgia, serif;
    font-optical-sizing: auto;
    font-weight: 400;
    font-size: 36px;
    line-height: 1.06;
    letter-spacing: -0.02em;
    color: var(--ts-ink);
    margin: 0 0 14px;
    text-wrap: balance;
  }
  .voice-h em {
    font-style: normal;
    color: var(--ts-brand-gold-deep);
    font-weight: 400;
  }
</style>
</head>
<body>
<div style="padding:6px 0;">
  <div class="pv-eyebrow">Voice samples</div>
  <p class="voice-h">
    Procurement doesn't need to be faster.<br>
    <em>It needs to not exist.</em>
  </p>
  <div style="display:flex;gap:14px;align-items:center;margin-top:18px;">
    <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ts-brand-gold);"></span>
    <span style="font-family:'Newsreader',serif;font-style:normal;font-size:14px;color:var(--ts-ink-soft);line-height:1.5;">"Three things need you this week. Everything else, the agent closed."</span>
  </div>
</div>
</body></html>
