<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Status</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
<style>
  /* Component styles re-declared inline so each card is self-contained */
  .btn { font-family:var(--ts-font-sans); font-weight:500; font-size:14px; padding:10px 18px; border-radius:4px; border:1px solid transparent; cursor:pointer; transition:background var(--ts-dur-fast) var(--ts-ease), border-color var(--ts-dur-fast); line-height:1; letter-spacing:-0.005em; }
  .btn-primary { background:var(--ts-brand-gold); color:#FFFEFB; }
  .btn-primary:hover { background:var(--ts-brand-gold-deep); }
  .btn-secondary { background:transparent; color:var(--ts-ink); border-color:var(--ts-line-strong); }
  .btn-secondary:hover { background:var(--ts-paper-deep); }
  .btn-tertiary { background:transparent; color:var(--ts-ink-soft); border-color:transparent; padding-left:10px; padding-right:10px; }
  .btn-tertiary:hover { color:var(--ts-ink); }
  .btn-danger { background:transparent; color:var(--ts-negative); border-color:var(--ts-negative-soft); }
  .btn-danger:hover { background:var(--ts-negative-wash); }
  .btn-sm { padding:7px 12px; font-size:12.5px; }
  .btn-ink { background:var(--ts-ink-night); color:var(--ts-paper); }
  .btn-ink:hover { background:#000; }

  .pill { display:inline-flex; align-items:center; gap:6px; font-family:var(--ts-font-sans); font-size:11px; font-weight:500; padding:4px 9px; border-radius:2px; letter-spacing:0.04em; text-transform:uppercase; }
  .pill .dot { width:6px; height:6px; border-radius:50%; }

  .input { font-family:var(--ts-font-sans); font-size:14px; padding:10px 12px; border-radius:4px; border:1px solid var(--ts-line); background:var(--ts-surface); color:var(--ts-ink); width:100%; outline:none; box-sizing:border-box; transition:border-color var(--ts-dur-fast) var(--ts-ease); }
  .input::placeholder { color:var(--ts-ink-faint); }
  .input:focus { border-color:var(--ts-brand-gold); box-shadow:0 0 0 2px var(--ts-brand-gold-wash); }
</style>
</head>
<body>

<div class="pv-eyebrow">Status pills</div>
<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;">
  <span class="pill" style="background:var(--ts-negative-wash);color:var(--ts-negative);"><span class="dot" style="background:var(--ts-negative);"></span>Signature required</span>
  <span class="pill" style="background:var(--ts-warning-wash);color:#8C6510;"><span class="dot" style="background:var(--ts-warning);"></span>Pending review</span>
  <span class="pill" style="background:var(--ts-info-wash);color:var(--ts-info);"><span class="dot" style="background:var(--ts-info);"></span>Escalated</span>
  <span class="pill" style="background:var(--ts-brand-gold-wash);color:var(--ts-brand-gold-deep);"><span class="dot" style="background:var(--ts-brand-gold);"></span>Quick confirm</span>
  <span class="pill" style="background:var(--ts-positive-wash);color:var(--ts-positive);"><span class="dot" style="background:var(--ts-positive);"></span>Approved</span>
  <span class="pill" style="background:var(--ts-paper-deep);color:var(--ts-ink-mute);"><span class="dot" style="background:var(--ts-ink-faint);"></span>Closed</span>
  <span class="pill" style="background:var(--ts-positive-wash);color:var(--ts-positive);"><span class="dot" style="background:var(--ts-positive);"></span>Auto-executed</span>
</div>
<div class="ts-caption">Compliance variant — inline, no chip background</div>
<div style="display:flex;gap:18px;margin-top:8px;">
  <span style="font-size:12px;color:var(--ts-positive);display:inline-flex;align-items:center;gap:6px;"><span style="width:6px;height:6px;border-radius:50%;background:var(--ts-positive);"></span>Compliant</span>
  <span style="font-size:12px;color:var(--ts-warning);display:inline-flex;align-items:center;gap:6px;"><span style="width:6px;height:6px;border-radius:50%;background:var(--ts-warning);"></span>Gaps</span>
  <span style="font-size:12px;color:var(--ts-negative);display:inline-flex;align-items:center;gap:6px;"><span style="width:6px;height:6px;border-radius:50%;background:var(--ts-negative);"></span>Blocked</span>
  <span style="font-size:12px;color:var(--ts-ink-mute);display:inline-flex;align-items:center;gap:6px;"><span style="width:6px;height:6px;border-radius:50%;background:var(--ts-ink-faint);"></span>Pending</span>
</div>
</body></html>
