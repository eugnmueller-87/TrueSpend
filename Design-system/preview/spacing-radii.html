<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_base.css">
</head>
<body>

<div class="pv-eyebrow">Radii — restrained</div>
<div style="display:flex;gap:16px;align-items:flex-end;">
  
    <div style="text-align:center;">
      <div style="width:84px;height:84px;background:var(--ts-surface);border:1px solid var(--ts-line);border-radius:2px;"></div>
      <div style="font-size:12px;color:var(--ts-ink);margin-top:8px;font-weight:500;">2px</div>
      <div class="ts-mono" style="color:var(--ts-ink-mute);font-size:10px;">--radius-xs</div>
    </div>
    <div style="text-align:center;">
      <div style="width:84px;height:84px;background:var(--ts-surface);border:1px solid var(--ts-line);border-radius:4px;"></div>
      <div style="font-size:12px;color:var(--ts-ink);margin-top:8px;font-weight:500;">4px</div>
      <div class="ts-mono" style="color:var(--ts-ink-mute);font-size:10px;">--radius-sm</div>
    </div>
    <div style="text-align:center;">
      <div style="width:84px;height:84px;background:var(--ts-surface);border:1px solid var(--ts-line);border-radius:6px;"></div>
      <div style="font-size:12px;color:var(--ts-ink);margin-top:8px;font-weight:500;">6px</div>
      <div class="ts-mono" style="color:var(--ts-ink-mute);font-size:10px;">--radius-md</div>
    </div>
    <div style="text-align:center;">
      <div style="width:84px;height:84px;background:var(--ts-surface);border:1px solid var(--ts-line);border-radius:10px;"></div>
      <div style="font-size:12px;color:var(--ts-ink);margin-top:8px;font-weight:500;">10px</div>
      <div class="ts-mono" style="color:var(--ts-ink-mute);font-size:10px;">--radius-lg</div>
    </div>
  <div style="text-align:center;">
    <div style="width:84px;height:84px;background:var(--ts-surface);border:1px solid var(--ts-line);border-radius:999px;"></div>
    <div style="font-size:12px;color:var(--ts-ink);margin-top:8px;font-weight:500;">pill</div>
    <div class="ts-mono" style="color:var(--ts-ink-mute);font-size:10px;">--radius-pill</div>
  </div>
</div>
<div class="ts-caption" style="margin-top:18px;">No 16/20/24px card radii. Cards are documents, not candy.</div>
</body></html>
