name: Build & Deploy Intake to Railway

on:
  push:
    branches: [main]
    paths:
      - 'intake/**'
      - 'Dockerfile'
      - '.github/workflows/deploy-intake.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/truespend-intake

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_POSTGREST_URL=${{ secrets.VITE_POSTGREST_URL }}
            VITE_POSTGREST_JWT=${{ secrets.VITE_POSTGREST_JWT }}
            VITE_N8N_WEBHOOK_URL=${{ secrets.VITE_N8N_WEBHOOK_URL }}

      - name: Deploy to Railway
        run: |
          IMAGE="ghcr.io/${{ env.IMAGE_NAME }}:latest"
          echo "Deployed image: $IMAGE"
          echo "IMAGE_TAG=ghcr.io/${{ env.IMAGE_NAME }}:sha-$(git rev-parse --short HEAD)" >> $GITHUB_ENV
